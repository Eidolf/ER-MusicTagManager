name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: er-musictagmanager-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == true && contains(github.event.release.tag_name, '-nightly.')) ||
      (github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-'))
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION=$(python3 scripts/version_manager.py --action calculate --type "$RELEASE_TYPE" --run-id "$RUN_ID")
            IS_PRERELEASE="false"
            if [[ "$RELEASE_TYPE" == "nightly" ]]; then
              IS_PRERELEASE="true"
            fi
          else
            VERSION="${RELEASE_TAG#v}"
            if [[ "$VERSION" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[1-9][0-9]*$ && "$RELEASE_PRERELEASE" == "false" ]]; then
              RELEASE_TYPE="stable"
              IS_PRERELEASE="false"
            elif [[ "$VERSION" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[1-9][0-9]*-nightly\.[0-9]{8}\.[0-9]{4}(\.[0-9]+)*$ && "$RELEASE_PRERELEASE" == "true" ]]; then
              RELEASE_TYPE="nightly"
              IS_PRERELEASE="true"
            else
              echo "Unsupported release tag or prerelease flag: $RELEASE_TAG" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Update Stable Version Mirror
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/version_manager.py --action write --version "$VERSION"

      - name: Commit Stable Version Mirror
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $VERSION"
            git push
          fi

      - name: Create Tag (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag already exists: ${TAG}" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Generate Release Notes (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'false' && 'true' || 'false' }}

      - name: Check Docker Hub Credentials
        id: check_dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.check_dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: steps.check_dockerhub.outputs.available == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/er-musictagmanager:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_prerelease == 'false' && format('{0}/er-musictagmanager:latest', secrets.DOCKER_USERNAME) || '' }}
        uses: docker/build-push-action@v5

  package:
    name: Build Apps
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ER-MusicTagManager-Linux
          - os: windows-latest
            asset_name: ER-MusicTagManager-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend
        run: cd frontend && npm ci

      - name: Build Frontend
        env:
          VITE_APP_VERSION: ${{ needs.release.outputs.version }}
        run: cd frontend && npm run build

      - name: Install Backend
        run: |
          pip install poetry
          cd backend && poetry install
          poetry run pip install pyinstaller

      - name: Build Executable
        run: |
          cd backend
          poetry run pyinstaller build.spec

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mv backend/dist/ER-MusicTagManager.exe "backend/dist/${ASSET_NAME}"
          gh release upload "v${VERSION}" "backend/dist/${ASSET_NAME}" --clobber

      - name: Archive Linux Build
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd backend/dist
          mv ER-MusicTagManager ER-MusicTagManager-Linux
          chmod +x ER-MusicTagManager-Linux
          tar -czvf ER-MusicTagManager-Linux.tar.gz ER-MusicTagManager-Linux

      - name: Upload Release Asset (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v${VERSION}" backend/dist/ER-MusicTagManager-Linux.tar.gz --clobber
